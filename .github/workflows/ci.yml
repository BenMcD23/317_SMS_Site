name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # No secrets: auth and the API are only read at request time, so a
        # build only needs the public defaults.
        env:
          AUTH_SECRET: ci-placeholder
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
