<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · 317 SMS</title>
    <style>
      /* Self-contained: when this shows, nothing else can be fetched. Colours
         are the app's own background, foreground and primary tokens. */
      :root {
        color-scheme: light dark;
        --bg: #f7f9fb;
        --fg: #0f172a;
        --muted: #5b6475;
        --primary: #1f3f7a;
        --on-primary: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070c16;
          --fg: #e8ecf3;
          --muted: #9aa4b5;
          --primary: #7aa2e3;
          --on-primary: #070c16;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1rem;
      }
      button {
        min-height: 2.5rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No signal</h1>
      <p>This page needs a connection to open.</p>
      <p>
        A marking sheet you already have open keeps working. Anything you submit without signal is kept on
        this phone and sends by itself when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
